server:
  port: 8082

spring:
  application:
    name: account-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5437}/${DB_NAME:finflow_accounts}}
    username: ${DB_USER:finflow_account}
    password: ${DB_PASSWORD:finflow_account_dev_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

jwt:
  secret: ${JWT_SECRET:change_this_dev_secret_with_at_least_32_chars_123456}

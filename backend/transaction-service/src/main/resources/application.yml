server:
  port: 8083

spring:
  application:
    name: transaction-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5438}/${DB_NAME:finflow_transactions}}
    username: ${DB_USER:finflow_transaction}
    password: ${DB_PASSWORD:finflow_transaction_dev_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

jwt:
  secret: ${JWT_SECRET:change_this_dev_secret_with_at_least_32_chars_123456}

clients:
  account-service:
    base-url: ${ACCOUNT_SERVICE_BASE_URL:http://localhost:8082}
